name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ffmpeg: independent loudness and true-peak meter for the audio test.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
