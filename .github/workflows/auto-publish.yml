name: Auto-publish

# Phase 3 (user decision 2026-11-20): the daily episode is published automatically after a hold
# time, so the owner can intervene first (`[publishing]` in the config). Hourly, this finds the
# oldest completed episode that is due (`gut_zu_wissen.autopublish`: hold time over, no `hold`
# label on its review issue, no error in the review) and publishes it with the same steps as
# `publish.yml`. Nothing due: the run ends after the first step. Hold an episode by putting the
# label `hold` on its review issue; remove the label to release it.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# Same group as the episode workflow: archive commits never overlap.
concurrency:
  group: episode
  cancel-in-progress: false

# contents: the archive commit; actions: read the audio artifact of the producing run and write to
# start the Pages build afterwards (a dispatch with the workflow token is allowed, a push is not
# followed by other workflows); issues: read the labels of the review issue.
permissions:
  contents: write
  actions: write
  issues: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      - name: Find the episode that is due
        id: due
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m gut_zu_wissen.autopublish
      - name: System packages
        if: steps.due.outputs.episode_id != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 ffmpeg
      - name: Download audio
        if: steps.due.outputs.episode_id != ''
        uses: actions/download-artifact@v4
        with:
          name: audio-${{ steps.due.outputs.run_id }}
          path: build/audio/
          run-id: ${{ steps.due.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish
        if: steps.due.outputs.episode_id != ''
        env:
          EPISODE_ID: ${{ steps.due.outputs.episode_id }}
          ARCHIVE_S3_ACCESS_KEY: ${{ secrets.ARCHIVE_S3_ACCESS_KEY }}
          ARCHIVE_S3_SECRET_KEY: ${{ secrets.ARCHIVE_S3_SECRET_KEY }}
        run: uv run python -m gut_zu_wissen.publish "$EPISODE_ID"
      - name: Commit archive
        if: steps.due.outputs.episode_id != ''
        env:
          EPISODE_ID: ${{ steps.due.outputs.episode_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive: published ${EPISODE_ID}"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt ${attempt}); rebasing on the remote branch."
            git pull --rebase
          done
          exit 1
      - name: Rebuild the site
        if: steps.due.outputs.episode_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml
