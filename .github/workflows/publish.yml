name: Publish

# Publishes a completed, reviewed episode to the Internet Archive (phase 2, user decision
# 2026-11-20: manual, after the review). The audio master comes from the workflow artifact of the
# run that produced the episode (`audio-<run id>`, kept 90 days by default). The inputs reach the
# shell only through the environment, never as an expression.
on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Archive folder of the completed episode (YYYY-MM-DD_slug)"
        required: true
        type: string
      run_id:
        description: "ID of the workflow run that produced the episode (artifact audio-<id>)"
        required: true
        type: string

# Same group as the episode workflow: archive commits never overlap.
concurrency:
  group: episode
  cancel-in-progress: false

# contents: the archive commit; actions: download the audio artifact of the earlier run.
permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}_[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$EPISODE_ID" =~ $pattern ]]; then
            echo "::error::Not an episode ID; expected an archive folder name (YYYY-MM-DD_slug)."
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The run ID is a number."
            exit 1
          fi
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      - name: Download audio
        uses: actions/download-artifact@v4
        with:
          name: audio-${{ inputs.run_id }}
          path: build/audio/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
          IA_ACCESS_KEY: ${{ secrets.ARCHIVE_S3_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.ARCHIVE_S3_SECRET_KEY }}
        run: uv run python -m gut_zu_wissen.publish "$EPISODE_ID"
      # Only a successful publish changes the archive (`published`, 10_publication.json); the
      # review workflow commits labels as well, so a rejected push is rebased and retried.
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive: published ${EPISODE_ID}"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt ${attempt}); rebasing on the remote branch."
            git pull --rebase
          done
          exit 1
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
