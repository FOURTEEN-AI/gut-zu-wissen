name: Episode

on:
  workflow_dispatch:
    inputs:
      article:
        description: "Title of the German Wikipedia article"
        required: true
        type: string

# Runs never overlap: a second run waits instead of being cancelled.
concurrency:
  group: episode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 fonts-dejavu-core
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      - name: Run pipeline
        env:
          ARTICLE: ${{ inputs.article }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: uv run python -m gut_zu_wissen.run "$ARTICLE"
      # Further pipeline steps follow in later plan steps.
      - name: Commit archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive: episode run for ${GITHUB_RUN_ID}"
          git push
