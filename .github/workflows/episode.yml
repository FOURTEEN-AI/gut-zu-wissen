name: Episode

on:
  workflow_dispatch:
    inputs:
      article:
        description: "Title of the German Wikipedia article"
        required: true
        type: string

# Runs never overlap: a second run waits instead of being cancelled.
concurrency:
  group: episode
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 fonts-dejavu-core
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      # Whisper model for the STT verification (spike S5): faster-whisper downloads it from
      # Hugging Face on first use; the cache saves the download (about 22 s per run).
      - name: Whisper model name
        id: stt
        run: >
          uv run python -c 'import tomllib;
          print("model=" + tomllib.load(open("config/pipeline.toml", "rb"))["models"]["stt"])'
          >> "$GITHUB_OUTPUT"
      - name: Restore Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-${{ steps.stt.outputs.model }}
      - name: Run pipeline
        env:
          ARTICLE: ${{ inputs.article }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m gut_zu_wissen.run "$ARTICLE"
      # Audio is not committed (design: audio only in the published form at the host);
      # in phase 1 it is a workflow artifact for listening and for the review.
      - name: Upload audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ github.run_id }}
          path: build/audio/
          if-no-files-found: ignore
      # Further pipeline steps follow in later plan steps.
      - name: Commit archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive: episode run for ${GITHUB_RUN_ID}"
          git push
