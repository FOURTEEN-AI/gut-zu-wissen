name: Resume audio

# Resumes an episode that failed in the audio step (TTS or STT error, STT budget used up, crash
# inside the step) from the archived final script, without repeating author and judge work
# (user decision 2026-11-20). The pipeline refuses every other episode. The steps shared with
# episode.yml are kept identical by tests/test_workflows.py.
on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Archive folder of the failed episode (YYYY-MM-DD_slug)"
        required: true
        type: string

# Same group as the episode workflow: a resume never overlaps an episode run.
concurrency:
  group: episode
  cancel-in-progress: false

# contents: the archive commit; issues: the review issue (phase 1 step 12).
permissions:
  contents: write
  issues: write

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # After the checkout, so the always() steps below find the repo. The input reaches the
      # shell only through the environment, never as an expression.
      - name: Check episode ID
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
        run: |
          pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}_[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$EPISODE_ID" =~ $pattern ]]; then
            echo "::error::Not an episode ID; expected an archive folder name (YYYY-MM-DD_slug)."
            exit 1
          fi
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --no-dev
      # Whisper model for the STT verification (spike S5): faster-whisper downloads it from
      # Hugging Face on first use; the cache saves the download (about 22 s per run).
      - name: Whisper model name
        id: stt
        run: >
          uv run python -c 'import tomllib;
          print("model=" + tomllib.load(open("config/pipeline.toml", "rb"))["models"]["stt"])'
          >> "$GITHUB_OUTPUT"
      - name: Restore Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-${{ steps.stt.outputs.model }}
      - name: Resume audio step
        id: run
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python -m gut_zu_wissen.resume "$EPISODE_ID"
      # Audio is not committed (design: audio only in the published form at the host);
      # in phase 1 it is a workflow artifact for listening and for the review.
      - name: Upload audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ github.run_id }}
          path: build/audio/
          if-no-files-found: ignore
      # Review issue for the drawn turns (phase 1 step 12); records its number in 09_review.json.
      # Without a drawn turn the issue is only for the explicit label. A failure fails the job;
      # the archive is committed anyway.
      - name: Open review issue
        if: steps.run.outputs.episode_id != ''
        env:
          EPISODE_ID: ${{ steps.run.outputs.episode_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m gut_zu_wissen.review open "$EPISODE_ID"
      # Runs on every outcome: a failed resume is recorded as `status: failed` in episode.json
      # and committed like a successful one (design: "Archiv"); a refused one changes nothing.
      # The review workflow commits labels to the archive as well; it never touches this run's
      # folder, so a rejected push is rebased and retried.
      - name: Commit archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive: episode run for ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt ${attempt}); rebasing on the remote branch."
            git pull --rebase
          done
          exit 1
