name: Spike S5 Whisper

# Phase 0 spike: Whisper runtime for ~15 min of audio on a hosted CPU runner.
# The test audio is a release asset (tag spike-s5-audio), so the repo stays small.
# Run twice: the first run measures a cold model download, the second a cache restore.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "faster-whisper model (small, medium, large-v3-turbo, large-v3)"
        required: true
        default: large-v3
        type: string

permissions:
  contents: read

jobs:
  whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group spikes
      - name: Restore model cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-${{ inputs.model }}
      - name: Download test audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download spike-s5-audio --dir audio
      - name: Runner
        run: nproc && free -g
      - name: Transcribe
        working-directory: spikes
        run: >
          uv run --group spikes python s5_whisper.py run ../audio/episode.flac
          --models ${{ inputs.model }} --reference ../audio/reference.txt
          --out ../result.json
      - run: echo "cache hit = ${{ steps.cache.outputs.cache-hit }}" && cat result.json
      - uses: actions/upload-artifact@v4
        with:
          name: s5-${{ inputs.model }}-${{ steps.cache.outputs.cache-hit == 'true' && 'warm' || 'cold' }}
          path: result.json
