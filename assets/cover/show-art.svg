<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <!--
    Show art for „Gut zu wissen“ (feed-level image, not an episode cover).
    Same palette, motif and font as cover-template.svg; no episode title.
    Font: DejaVu Sans Bold from the system package fonts-dejavu-core.
  -->
  <rect width="3000" height="3000" fill="#2236B8"/>

  <!-- Motif from the episode template, scaled 1.8x: article text (lines)
       becomes a conversation (waveform); yellow = Lena, blue = Felix. -->
