<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <!--
    Cover template for „Gut zu wissen“.

    Contract for the pipeline:
    - Replace the content of <text id="title"> with one <tspan> per line.
    - Fit the title into <rect id="title-box">: wrap at word boundaries
      (no line limit), then shrink the font size from data-font-max until
      the block fits the box. No ellipsis.
    - Line height = font size × data-line-height.
    - Alignment: left; block anchored to the bottom of the box.
    - Font: DejaVu Sans Bold, bundled in assets/cover/fonts/DejaVuSans-Bold.ttf
      (licence next to it); no system font, no external resources.
  -->
  <rect width="3000" height="3000" fill="#2236B8"/>

  <!-- Pipeline: article text (lines) becomes a conversation (waveform);
       colour runs are turns: yellow = Lena, blue = Felix.
       Aligned to the wordmark: cap top of „Gut zu“ to baseline of „wissen“. -->
  <rect x="1380" y="385.0" width="560" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="1380" y="468.8" width="480" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="1380" y="552.6" width="600" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="1380" y="636.4" width="420" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="1380" y="720.2" width="540" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="1380" y="804.0" width="300" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.35"/>

  <rect x="2026" y="548.5" width="38" height="128.0" rx="19" fill="#FFD23F"/>
  <rect x="2084" y="498.8" width="38" height="227.5" rx="19" fill="#FFD23F"/>
  <rect x="2142" y="449.0" width="38" height="327.0" rx="19" fill="#FFD23F"/>
  <rect x="2200" y="520.1" width="38" height="184.8" rx="19" fill="#8FD3FF"/>
  <rect x="2258" y="420.6" width="38" height="383.9" rx="19" fill="#8FD3FF"/>
  <rect x="2316" y="477.5" width="38" height="270.1" rx="19" fill="#8FD3FF"/>
  <rect x="2374" y="385.0" width="38" height="455.0" rx="19" fill="#8FD3FF"/>
  <rect x="2432" y="505.9" width="38" height="213.3" rx="19" fill="#FFD23F"/>
  <rect x="2490" y="441.9" width="38" height="341.2" rx="19" fill="#FFD23F"/>
  <rect x="2548" y="413.5" width="38" height="398.1" rx="19" fill="#FFD23F"/>
  <rect x="2606" y="527.2" width="38" height="170.6" rx="19" fill="#8FD3FF"/>
  <rect x="2664" y="470.3" width="38" height="284.4" rx="19" fill="#8FD3FF"/>
  <rect x="2722" y="555.6" width="38" height="113.7" rx="19" fill="#8FD3FF"/>

  <text font-family="DejaVu Sans" font-weight="bold"
        font-size="240" fill="#FFFFFF" letter-spacing="-8">
    <tspan x="240" y="560">Gut zu</tspan>
    <tspan x="240" y="840">wissen</tspan>
  </text>

  <rect id="title-box" x="240" y="1500" width="2520" height="1260"
        fill="none" stroke="none"
        data-font-max="320" data-line-height="1.05"
        data-align="left" data-valign="bottom"/>

  <text id="title" font-family="DejaVu Sans" font-weight="bold"
        font-size="320" fill="#FFFFFF" letter-spacing="-6">
    <tspan x="240" y="2760">{{TITLE}}</tspan>
  </text>
</svg>
