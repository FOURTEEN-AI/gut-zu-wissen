# Pipeline configuration (design: docs/wikipedia-podcast-pipeline.md).
# No secrets in this file. API keys come from environment variables / GitHub secrets.
# Every value "PLACEHOLDER" is unknown and must be filled in before the step that needs it.

[judge]
t = 0.95                 # threshold, one value for all questions; recalibrated later
# all p >= t: supported; any p <= 1 - t: not supported; otherwise LLM judge verdict

[jev]
max_retries = 3          # transient errors (429, 5xx, timeout), then the LLM judge decides
backoff_seconds = 2.0    # doubled per attempt
timeout_seconds = 120

[tts]
max_retries = 3          # transient errors (429, 5xx, timeout); a 429 waits the time it names
backoff_seconds = 2.0    # doubled per attempt, when no wait time is named
timeout_seconds = 300    # spike S4: about 30 s per 6-minute section, 173 s for 35 minutes

[stt]
# Whisper locally with faster-whisper (spike S5: large-v3 int8 takes about 11 min per 16 min of
# audio on a 4-CPU Actions runner). Decoding settings as measured in S5.
compute_type = "int8"
cpu_threads = 4                     # ubuntu-latest runners for public repos have 4 vCPUs
language = "de"
beam_size = 5
vad_filter = true
condition_on_previous_text = false
context_words = 6                   # script words before and after a deviation, shown to the LLM

[review]
# Sampling (design: "Stichproben"). The current r lives in archive/state/review.json; r_initial
# applies only while that file does not exist.
r_initial = 1.0          # sampling rate start (100 %)
r_min = 0.01             # lower bound (1 %)
r_max = 1.0              # upper bound (100 %)
r_factor_clean = "2/3"   # error-free reviewed episode: r * 2/3
r_factor_error = 2       # error found: r * 2, at most r_max
# Phase 1 keeps r at 100 % until the exit criteria (step 13: 5 episodes fully reviewed at
# r = 100 %) are met; answered reviews are still recorded in the state file. Set to true after.
adjust_rate = false
# Only comments by this GitHub account become labels, and only with one of these
# author_association values (the repo belongs to an organisation, so the owner may show as MEMBER).
reviewer = "ajFourteen"
reviewer_associations = ["OWNER", "MEMBER", "COLLABORATOR"]
issue_max_chars = 60000  # per issue body or comment; GitHub's limit is 65,536 characters

[run]
# A crash (unexpected exception) is recorded as failed; the reason names the exception type and
# its message, cut to this length, in episode.json and the job summary.
failure_reason_max_chars = 300

[exit_criteria]
# Phase 1 step 13: this many episodes fully reviewed (every drawn turn and the explicit check
# labelled) whose sample was drawn at this rate (100 %).
episodes = 5
rate = 1.0

[models]
author = "claude-sonnet-5-5"        # extraction, ranking, dialog author (Claude Sonnet 5.5)
llm_judge = "claude-sonnet-5-5"     # judge stage 2, same model as the author (design)
jev = "jev-1.14.0"                  # TypeSafe, judge stage 1; pinned version (spike S1)
tts = "gemini-3.8-flash-tts"        # Gemini 3.8 Flash TTS
tts_voice_lena = "de-de-advisor-3"    # Gemini library voice, spike S4, confirmed by ear
tts_voice_felix = "de-de-tutor-4"     # Gemini library voice, spike S4, confirmed by ear
stt = "large-v3"                    # Whisper model (faster-whisper), spike S5

[quotas]
main_facts = 20
linked_intro_facts = 6
min_used_facts = 10                 # D5
min_fact_words = 8
max_context_segments = 3
max_chunk_segments = 40             # extraction: sections above this are split into equal parts
llm_max_tokens = 16000              # output ceiling per extraction call
turn_retries = 2
conversation_retries = 2
audio_section_retries = 2
substitute_articles_max = 2         # phase 3
repeat_gate_months = 6              # D4
tts_section_max_chars = 6000        # spike S4: about 6 min of audio; documented cap is 16,384 output tokens
target_loudness_lufs = -16          # decided, with a true-peak limiter (spike S4)
true_peak_ceiling_dbtp = -1.5       # limiter ceiling; raw TTS output is about -20 LUFS

[audio]
# Joins (spike S4 proposal for step 9, not tested by ear): silence at the edges of every part
# (intro, sections, outro) is shortened to edge_silence_keep_seconds, then join_pause_seconds of
# silence goes between the parts. Raw sections have 0.2-0.8 s of edge silence.
edge_silence_floor_db = -45.0       # a 10 ms frame below this RMS level (dBFS) counts as silence
edge_silence_frame_seconds = 0.01
edge_silence_keep_seconds = 0.15
join_pause_seconds = 0.4
# Loudness normalisation to quotas.target_loudness_lufs with a true-peak limiter at
# quotas.true_peak_ceiling_dbtp. The limiter lowers the gain towards a peak at the attack rate
# (look-ahead) and recovers after it at the release rate.
limiter_attack_db_per_second = 1200.0   # 6 dB in 5 ms
limiter_release_db_per_second = 60.0    # 6 dB in 100 ms
loudness_tolerance_lu = 0.1             # accepted deviation of the output from the target
loudness_max_iterations = 8             # gain/ceiling corrections before the run fails

[prices]
# Feed the per-episode cost log. USD per million tokens unless stated otherwise.
claude_sonnet_input = 2.00          # Claude Sonnet 5.5, Anthropic list price (as of 2026-11)
claude_sonnet_output = 10.00        # Claude Sonnet 5.5, Anthropic list price (as of 2026-11)
jev = 0.042                         # USD per million input tokens; output tokens free (spike S1)
gemini_tts_input = 0.50                #  USD per million text tokens; 1.00 from 2027-01-01
gemini_tts_output = 9.00               #  USD per million audio tokens; 18.00 from 2027-01-01
