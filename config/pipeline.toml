# Pipeline configuration (design: docs/wikipedia-podcast-pipeline.md).
# No secrets in this file. API keys come from environment variables / GitHub secrets.
# Every value "PLACEHOLDER" is unknown and must be filled in before the step that needs it.

[judge]
t = 0.95                 # threshold, one value for all questions; recalibrated later
# all p >= t: supported; any p <= 1 - t: not supported; otherwise LLM judge verdict

[review]
r_initial = 1.0          # sampling rate start (100 %)
r_min = 0.01             # lower bound (1 %)
r_factor_clean = "2/3"   # error-free reviewed episode: r * 2/3
r_factor_error = 2       # error found: r * 2, at most 1.0

[models]
author = "claude-sonnet-5-5"        # extraction, ranking, dialog author (Claude Sonnet 5.5)
llm_judge = "claude-sonnet-5-5"     # judge stage 2, same model as the author (design)
jev = "jev-1.14.0"                  # TypeSafe, judge stage 1; pinned version (spike S1)
tts = "gemini-3.8-flash-tts"        # Gemini 3.8 Flash TTS
tts_voice_lena = "de-de-advisor-3"    # Gemini library voice, spike S4, confirmed by ear
tts_voice_felix = "de-de-tutor-4"     # Gemini library voice, spike S4, confirmed by ear
stt = "PLACEHOLDER"                 # Whisper model size, spike S5

[quotas]
main_facts = 20
linked_intro_facts = 6
min_used_facts = 10                 # D5
min_fact_words = 8
max_context_segments = 3
max_chunk_segments = 40             # extraction: sections above this are split into equal parts
llm_max_tokens = 16000              # output ceiling per extraction call
turn_retries = 2
conversation_retries = 2
audio_section_retries = 2
substitute_articles_max = 2         # phase 3
repeat_gate_months = 6              # D4
tts_section_max_chars = 6000        # spike S4: about 6 min of audio; documented cap is 16,384 output tokens
target_loudness_lufs = -16          # decided, with a true-peak limiter (spike S4)
true_peak_ceiling_dbtp = -1.5       # limiter ceiling; raw TTS output is about -20 LUFS

[prices]
# Feed the per-episode cost log. Unit and currency to be fixed together with the values.
claude_sonnet_input = "PLACEHOLDER"
claude_sonnet_output = "PLACEHOLDER"
jev = 0.042                         # USD per million input tokens; output tokens free (spike S1)
gemini_tts_input = 0.50                #  USD per million text tokens; 1.00 from 2027-01-01
gemini_tts_output = 9.00               #  USD per million audio tokens; 18.00 from 2027-01-01
