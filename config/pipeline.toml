# Pipeline configuration (design: docs/wikipedia-podcast-pipeline.md).
# No secrets in this file. API keys come from environment variables / GitHub secrets.
# Every value "PLACEHOLDER" is unknown and must be filled in before the step that needs it.

[judge]
t = 0.95                 # threshold, one value for all questions; recalibrated later
# all p >= t: supported; any p <= 1 - t: not supported; otherwise LLM judge verdict

[jev]
max_retries = 3          # transient errors (429, 5xx, timeout), then the LLM judge decides
backoff_seconds = 2.0    # doubled per attempt
timeout_seconds = 120

[tts]
max_retries = 3          # transient errors (429, 5xx, timeout); a 429 waits the time it names
backoff_seconds = 2.0    # doubled per attempt, when no wait time is named
timeout_seconds = 300    # spike S4: about 30 s per 6-minute section, 173 s for 35 minutes

[stt]
# Whisper locally with faster-whisper (spike S5: large-v3 int8 takes about 11 min per 16 min of
# audio on a 4-CPU Actions runner). Decoding settings as measured in S5.
compute_type = "int8"
cpu_threads = 4                     # ubuntu-latest runners for public repos have 4 vCPUs
language = "de"
beam_size = 5
vad_filter = true
condition_on_previous_text = false
context_words = 6                   # script words before and after a deviation, shown to the LLM

[review]
# Sampling (design: "Stichproben"). The current r lives in archive/state/review.json; r_initial
# applies only while that file does not exist.
r_initial = 1.0          # sampling rate start (100 %)
r_min = 0.01             # lower bound (1 %)
r_max = 1.0              # upper bound (100 %)
r_factor_clean = "2/3"   # error-free reviewed episode: r * 2/3
r_factor_error = 2       # error found: r * 2, at most r_max
# Phase 1 keeps r at 100 % until the exit criteria (step 13: 5 episodes fully reviewed at
# r = 100 %) are met; answered reviews are still recorded in the state file. Step 13 was met on
# 2026-11-20, so r now follows the rate rule.
adjust_rate = true
# Only comments by this GitHub account become labels, and only with one of these
# author_association values (the repo belongs to an organisation, so the owner may show as MEMBER).
reviewer = "ajFourteen"
reviewer_associations = ["OWNER", "MEMBER", "COLLABORATOR"]
issue_max_chars = 60000  # per issue body or comment; GitHub's limit is 65,536 characters

[run]
# A crash (unexpected exception) is recorded as failed; the reason names the exception type and
# its message, cut to this length, in episode.json and the job summary.
failure_reason_max_chars = 300

[exit_criteria]
# Phase 1 step 13: this many episodes fully reviewed (every drawn turn and the explicit check
# labelled) whose sample was drawn at this rate (100 %).
episodes = 5
rate = 1.0

[models]
author = "claude-sonnet-5-5"        # ranking, dialog author (Claude Sonnet 5.5)
extraction = "claude-haiku-5-5"     # extraction, main article and linked intros (Claude Haiku 5.5; user decision 2026-11-20, spike S7)
llm_judge = "claude-sonnet-5-5"     # judge stage 2, same model as the author (design)
jev = "jev-1.14.0"                  # TypeSafe, judge stage 1; pinned version (spike S1)
tts = "gemini-3.8-flash-tts"        # Gemini 3.8 Flash TTS
tts_voice_lena = "de-de-advisor-3"    # Gemini library voice, spike S4, confirmed by ear
tts_voice_felix = "de-de-tutor-4"     # Gemini library voice, spike S4, confirmed by ear
stt = "large-v3"                    # Whisper model (faster-whisper), spike S5

[quotas]
# Offer range (decided 2026-11-20): at least min if extraction yields that many, at most max;
# beyond min only genuinely surprising, non-duplicate facts. Fewer than min is allowed (D5 gate).
main_facts_min = 20
main_facts_max = 40
linked_intro_facts_min = 6
linked_intro_facts_max = 12
# Einordnung (decided 2026-11-20): the first intro sentences of the main article that pass the
# fact gates, always offered first, outside the ranking and the main quota. The first prose
# sentence of the intro is always #1 when it passes them and is never excluded by D6.
einordnung_facts_max = 2
# Link targets fetched per offer, taken from the most surprising facts on; the rest is listed in
# 04_ranking.json. Assumption (2026-11-20): about today's load, Axolotl had 27 for 20 facts.
linked_targets_max = 30
min_used_facts = 10                 # D5
max_turns_per_fact = 2              # repetition gate (2026-11-20): first narration + one follow-up; the last turn (summary) is not counted
min_fact_words = 8
max_context_segments = 3
max_chunk_segments = 40             # extraction: sections above this are split into equal parts
llm_max_tokens = 16000              # output ceiling per extraction call
llm_max_tokens_dialog = 64000       # output ceiling for the dialog author (whole dialog, thinking included); 16000 was cut off in all 5 first runs
turn_retries = 2                    # D1: judge rejections per triggering turn, cascade included
gate_retries = 3                    # D1 (2026-11-20): gate rejections per triggering turn, own budget
conversation_retries = 2
audio_section_retries = 2
substitute_articles_max = 2         # phase 3
repeat_gate_months = 6              # D4
tts_section_max_chars = 6000        # spike S4: about 6 min of audio; documented cap is 16,384 output tokens
target_loudness_lufs = -16          # decided, with a true-peak limiter (spike S4)
true_peak_ceiling_dbtp = -1.5       # limiter ceiling; raw TTS output is about -20 LUFS

[audio]
# Joins (spike S4 proposal for step 9, not tested by ear): silence at the edges of every part
# (intro, sections, outro) is shortened to edge_silence_keep_seconds, then join_pause_seconds of
# silence goes between the parts. Raw sections have 0.2-0.8 s of edge silence.
edge_silence_floor_db = -45.0       # a 10 ms frame below this RMS level (dBFS) counts as silence
edge_silence_frame_seconds = 0.01
edge_silence_keep_seconds = 0.15
join_pause_seconds = 0.4
# Loudness normalisation to quotas.target_loudness_lufs with a true-peak limiter at
# quotas.true_peak_ceiling_dbtp. The limiter lowers the gain towards a peak at the attack rate
# (look-ahead) and recovers after it at the release rate.
limiter_attack_db_per_second = 1200.0   # 6 dB in 5 ms
limiter_release_db_per_second = 60.0    # 6 dB in 100 ms
loudness_tolerance_lu = 0.1             # accepted deviation of the output from the target
loudness_max_iterations = 8             # gain/ceiling corrections before the run fails

# General pronunciation lexicon: names the TTS voices get wrong in many episodes (decided
# 2026-11-20). Empty for now; an entry for a single episode belongs in `pronunciation.json` in
# its archive folder. `spoken` goes to the TTS instead of `written`; `heard` lists what Whisper
# writes for it, which counts as `written` in the check. Script and archive keep `written`.
# [[pronunciation]]
# written = "..."
# spoken = "..."
# heard = ["..."]

[prices]
# Feed the per-episode cost log. USD per million tokens unless stated otherwise.
claude_sonnet_input = 2.00          # Claude Sonnet 5.5, Anthropic list price (as of 2026-11)
claude_sonnet_output = 10.00        # Claude Sonnet 5.5, Anthropic list price (as of 2026-11)
# Prompt caching (spike S7): 5-minute cache writes cost 1.25 x input, cache reads are priced per
# model. Anthropic list prices as of 2026-11 (claude-api skill).
claude_sonnet_cache_write = 2.50    # Claude Sonnet 5.5, 5-minute TTL (1.25 x 2.00)
claude_sonnet_cache_read = 0.10     # Claude Sonnet 5.5
# Claude Haiku 5.5 (extraction) has two rate cards by prompt length: these are for prompts of at
# most 100K tokens (0.50 / 2.50 above). An extraction prompt is one chunk of at most
# quotas.max_chunk_segments segments plus the system prompt, about 2.5K tokens (spike S7), far
# below the limit, so the cost log uses these prices only.
claude_haiku_input = 0.10           # Claude Haiku 5.5, prompts <= 100K tokens
claude_haiku_output = 0.50          # Claude Haiku 5.5, prompts <= 100K tokens
claude_haiku_cache_write = 0.125    # Claude Haiku 5.5, 5-minute TTL (1.25 x 0.10)
claude_haiku_cache_read = 0.01      # Claude Haiku 5.5 (0.1 x input)
jev = 0.042                         # USD per million input tokens; output tokens free (spike S1)
gemini_tts_input = 0.50                #  USD per million text tokens; 1.00 from 2027-01-01
gemini_tts_output = 9.00               #  USD per million audio tokens; 18.00 from 2027-01-01

[publishing]
# Automatic publication of the daily episode (phase 3, user decision 2026-11-20): the
# `Auto-publish` workflow runs once a day at a fixed time (10:00 UTC, 11:00 German winter time) and
# publishes the episode if its run ended at least `min_age_hours` before; so the owner can
# intervene until then. An episode that ends later waits for the next day. The owner holds an episode by putting the label
# `hold_label` on its review issue (remove it to release). An episode whose review found an error
# is never published automatically. ASSUMPTION: 2 hours (the daily run ends around 5 to 6 o'clock
# German time); see docs/phase3-assumptions.md.
min_age_hours = 2
hold_label = "hold"

[hosting]
# Internet Archive, S3-like API (phase 2). Keys come from the environment (GitHub secrets
# ARCHIVE_S3_ACCESS_KEY and ARCHIVE_S3_SECRET_KEY), never from this file.
s3_endpoint = "https://s3.us.archive.org"
metadata_endpoint = "https://archive.org/metadata"
download_base = "https://archive.org/download"
details_base = "https://archive.org/details"
# One item per episode: "<prefix>_<episode id>", cut to the identifier limit with a hash suffix.
identifier_prefix = "gut-zu-wissen"
identifier_max_chars = 100
collection = "opensource_audio"
mediatype = "audio"
language = "ger"
creator = "Gut zu wissen"
licence_url = "https://creativecommons.org/licenses/by-sa/4.0/"
subjects = ["Podcast", "Wikipedia", "Wissen"]
description = "Folge von „Gut zu wissen“ über den Wikipedia-Artikel „{title}“. Alle Inhalte stammen aus der deutschsprachigen Wikipedia (CC BY-SA 4.0). Die Folge ist mit KI entstanden: Auswahl der Fakten, Gespräch und Stimmen. KI kann Fehler machen."
audio_file = "episode.mp3"
cover_file = "cover.png"
cover_size_px = 3000                # D7: 1400-3000 px, square
mp3_bitrate_kbps = 128
max_retries = 3                     # 429, 5xx, timeout
backoff_seconds = 2.0               # doubled per attempt
timeout_seconds = 600               # one upload request (about 15 MB of audio)
ready_timeout_seconds = 900         # the files must show up in the item's file list
ready_poll_seconds = 15

[site]
# Static GitHub Pages site and RSS feed (phase 2). ASSUMPTION (docs/phase2-assumptions.md): the
# site lives at the repository's default Pages address; change base_url when a custom domain is set.
base_url = "https://fourteen-ai.github.io/gut-zu-wissen"
title = "Gut zu wissen"
description = "In jeder Folge nehmen sich Lena und Felix, zwei KI-Stimmen, einen Artikel der deutschsprachigen Wikipedia vor und erzählen die überraschendsten Fakten daraus. Jede Aussage wird gegen den Artikel geprüft."
language = "de"
author = "FOURTEEN IT UG (haftungsbeschränkt)"
owner_email = "gut-zu-wissen@fourteen-it.de"   # D7; Spotify's verification mail goes here
category = "Education"                          # D7
feed_explicit = false                           # D7: per episode from the explicit check
copyright = "CC BY-SA 4.0"
feedback_address = "gut-zu-wissen@fourteen-it.de"
show_art_source = "assets/cover/show-art.png"
show_art_file = "show-art.png"
cover_size_px = 3000                            # episode covers on the site (D7: 1400-3000 px)
wikipedia_index = "https://de.wikipedia.org/w/index.php"
# The feed carries these as HTML (Spotify and Apple accept p, a, br, ul, li). {title} is escaped.
description_html = '<p>{description}</p><p>Website mit Shownotes: <a href="{base_url}">{base_url}</a><br>So funktioniert der Podcast: <a href="{base_url}/so-funktionierts.html">{base_url}/so-funktionierts.html</a></p><p>Feedback: <a href="mailto:{feedback_address}">{feedback_address}</a></p>'
episode_description = '<p>Eine Folge über den Wikipedia-Artikel „{title}“. Mit KI erstellt, KI kann Fehler machen.</p><p>Quellen, Versionen und Autorinnen und Autoren: <a href="{page_url}">{page_url}</a> (Lizenz CC BY-SA 4.0)</p><p>So funktioniert der Podcast: <a href="{howto_url}">{howto_url}</a></p><p>Fehler gehört? <a href="{feedback_url}">Feedback per E-Mail</a></p>'
