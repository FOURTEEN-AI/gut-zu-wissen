[project]
name = "gut-zu-wissen"
version = "0.1.0"
description = "German podcast generated from German Wikipedia articles"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "cairosvg",
    "Pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
spikes = [
    "httpx>=0.28.1",
    "somajo>=2.5.0",
    "typesafe-sdk>=0.7.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gut_zu_wissen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
